{% extends 'base.html' %}

{% block content %}
<div class="auth-shell">
    <div class="card form-card">
        <h2>
            {% if user %}
            Edit Profile
            {% else %}
            Create Account
            {% endif %}
        </h2>

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
                {% if user.name %}
                Update
                {% else %}
                Register
                {% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
