{% extends 'base.html' %}

{% block title %}
{% if form.instance.pk %}
Edit
{% else %}
Add
{% endif %}
Task
{% endblock %}

{% block content %}

<form method="post" class="task-form">
    {% csrf_token %}

    <h1>
        {% if form.instance.pk %}
        Edit
        {% else %}
        Add
        {% endif %}
        Task
    </h1>

    {{ form.as_p }}

    <button type="submit">Submit</button>

    <button type="button">
        <a href="{% url 'tasks' %}">Cancel</a>
    </button>
</form>

{% endblock %}
