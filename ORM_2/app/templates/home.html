<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DashBoard</title>
</head>

<body>
    <h1>Students List</h1>
    {% if students %}
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Emial</th>
                <th>Mobile</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students%}
            <tr>
                <td>{{student.name}}</td>
                <td>{{student.age}}</td>
                <td>{{student.email}}</td>
                <td>{{student.mobile}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <h1>No Students was in DataBase </h1>
    {% endif %}
</body>

</html>
