<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .success {
        color: greenyellow;
    }

    .warning {
        color: red;
    }
</style>

<body>
    <h1>Contrib Messages</h1>
    {% if messages %}
    <ul>
        {% for mess in messages %}
        <li class="{{mess.tags}}">{{mess}}</li>
        {% endfor %}
    </ul>
    {% else %}
    <i>No Messages !!!</i>
    {% endif %}
</body>

</html>
