{% extends "base.html" %}

{% block title %}Log in | Django Signals{% endblock %}

{% block content %}
<main>
    <section class="panel">
        <h1>Log in</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
            {% endfor %}
            <div class="actions">
                <button class="button" type="submit">Log in</button>
                <a class="button secondary" href="{% url 'Register' %}">Create account</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
